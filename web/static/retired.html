<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="refresh" content="0; url=https://github.com/KodyDennon/GlobalTelco" />
		<title>GlobalTelco moved to GitHub</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #0a0e17;
				color: #f3f4f6;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
			}

			main {
				width: min(560px, calc(100vw - 32px));
				text-align: center;
			}

			h1 {
				margin: 0 0 12px;
				font-size: 28px;
			}

			p {
				margin: 0 0 24px;
				color: #9ca3af;
				line-height: 1.5;
			}

			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 44px;
				padding: 0 18px;
				border-radius: 8px;
				background: #10b981;
				color: #04110d;
				font-weight: 700;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>GlobalTelco has moved</h1>
			<p>The hosted game is retired. The project is available in the public repository.</p>
			<a href="https://github.com/KodyDennon/GlobalTelco">Open public repo</a>
		</main>
	</body>
</html>
